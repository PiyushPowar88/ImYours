server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router needs this — all routes fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}